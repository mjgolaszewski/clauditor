name: One-time canonical BCF Lite bootstrap
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: clauditor-initial-lite-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    name: Install BCF Lite and retire temporary writer
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install strictly from immutable BCF release
        shell: bash
        run: |
          set -euo pipefail
          if [ -f governance-profile.yml ]; then
            echo 'Governance already installed; no bootstrap mutation.'
            exit 0
          fi
          git config user.name 'clauditor-bootstrap[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/bootstrap-lite.sh
          rm .github/workflows/bootstrap-lite.yml
          git add -A
          git commit -m 'chore: retire one-time BCF Lite bootstrap writer'
          git push origin HEAD:main
