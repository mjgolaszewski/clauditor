name: One-time canonical BCF Lite bootstrap
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: clauditor-initial-lite-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    name: Install BCF Lite; stage workflow for authorized finalization
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install canonical Lite pack without workflow write escalation
        shell: bash
        run: |
          set -euo pipefail
          if [ -f governance-profile.yml ]; then
            echo 'Governance already installed; no bootstrap mutation.'
            exit 0
          fi
          git config user.name 'clauditor-bootstrap[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/bootstrap-lite.sh
          test -f .github/workflows/governance.yml
          mkdir -p .bootstrap-handoff
          mv .github/workflows/governance.yml .bootstrap-handoff/governance.yml
          sha256sum .bootstrap-handoff/governance.yml
          git add -A
          git reset --soft HEAD~1
          git commit -m 'chore: install validated BCF Lite pack; stage generated workflow for owner admission'
          if git diff --name-only origin/main..HEAD -- .github/workflows | grep -q .; then
            echo 'Refusing GitHub Actions push containing workflow mutations.' >&2
            exit 2
          fi
          git push origin HEAD:main
