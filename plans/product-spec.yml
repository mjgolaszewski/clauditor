product:
  name: Clauditor
  project_name: Clauditor
  positioning: single-tenant Anthropic OpenTelemetry collection, preservation, compliance reporting and alerting appliance for RIAs
  target_users: [RIA compliance administrators and designated reviewers (2-4 local reporting users), Employees emitting supported Claude/Cowork/Claude Code/API telemetry (12-24 monitored users)]
  non_goals: [No IdP/SSO integration in MVP; use local appliance user roles., No Compliance API integration or independent transcript fetching in MVP., No guarantee of complete content or artifacts when Anthropic does not emit them., 'No certification of SEC books-and-records retention, WORM or all-user activity.', 'No mandatory SaaS, paid observability or license-key-dependent runtime.']
