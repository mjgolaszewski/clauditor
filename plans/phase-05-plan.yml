  - Project exact source-available prompts, response, tool, connector, skill and artifact metadata with content-availability
    states.
  - Create source-bound timeline reconstruction with session, prompt and trace sequence uncertainty.
  - Provision Grafana OSS local administrator/reviewer roles and non-writable SQL datasource.
  - "Prove first MVP Cowork/Claude Code prompt\u2192archive\u2192SQL\u2192authenticated session view using fixtures."
  - Provision Grafana views for conversation, tools, MCP, connectors, skills, content and coverage.
  - Provide per-user/source/model token, latency, cost estimate and storage dashboarding.
  - Deliver role-protected bounded CSV/JSON exports with exact query scope and signed or hashed source manifest.
  parallelizable_workstreams:
  - id: P05-WS1
    name: Qualified dependency-first packets; isolated resources and no overlapping write roots
  hard_dependencies:
