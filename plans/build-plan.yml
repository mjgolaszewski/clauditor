document: {kind: machine_readable_build_plan, name: Clauditor Build Plan, id: clauditor-build-plan, version: 1.0.0, generated_at_utc: '2026-10-23T00:00:00Z', status: active, path: plans/build-plan.yml}
planning_contract:
  format: yaml
  mandatory_properties: [tightly_scoped_deliverables, parallelizable_workstreams, hard_dependency_ordering, docker_first_local_runtime, ast_architecture_tests, strict_boundaries, observability_reference_model, completeness_standard]
  completeness_standard: full_completeness_for_declared_scope
planning_inputs:
  date: '2026-10-23'
  planner: codex
  primary_source_of_truth: plans/product-spec.yml
  governance_references: [AGENTS.yml, MEMORY.yml, plans/phase-ledger.yml, spec/clauditor/v1/model.json, spec/clauditor/v1/construction/plan.json]
global_delivery_rules:
  - change units default to the smallest valid vertical slice with low blast radius
  - every behavior change must update specs, plans, MEMORY, and tests together
  - preserve public contracts unless an explicit instruction and migration note authorize a breaking change
  - release gates must run in a declared runtime environment
  - governed artifacts must pass structural schema validation before semantic cross-artifact validation
  - architecture boundaries must be encoded in tests, not left as convention-only prose
  - backend delivery defaults to CQRS-lite with strict ports unless repo governance changes it explicitly
  - 'backend delivery follows contract-first sequencing: contracts, ports, tests, use case, router, and infrastructure only as required'
  - governance changes must pass semantic validation, not only YAML parse checks
  - observability changes must preserve the shared telemetry and logging contract baseline
  - active phase lifecycle uses the governed taxonomy and records control metadata when work is blocked, paused, or abandoned
  - governed build artifacts must follow the template-pack naming and validation conventions
  - completed release trains must preserve governed phase history for each declared phase
  - new abstractions require proven reuse across at least two real call sites unless explicitly authorized
  - emergency red-CI and release-blocking fixes must use the governed hotfix lane
  - lite hotfix mode is reserved for a single-commit repair with no public-contract or security-scope change; all other hotfixes use full mode
  - Invariant -> unique canonical owner -> primitive -> contract/state -> producer/consumer -> exact evidence; preserve existing BCF owners.
  - Canonical phase records own lifecycle; candidate A-J packets provide bounded source context only. All 39 requirements and 45 packet IDs remain traceable.
  - Only planning, governance tools, tests and minimal qualification probes are authorized before Standard 3.0 promotion; substantial construction is gated.
  - No no-op, all-skipped, invented-symbol or broad N/A promotion shortcuts. Required unavailable gates block promotion.
  - After successful promotion plus reconciliation, graph and provider verification, pause before construction; no deploy or release.
  - Contract-first CQRS/ports for custom code; use qualified OSS before adding helpers; 800 LOC source cap and AST boundary gates.
  - Docker-first isolated Linux projects, credentials and volumes; parallel work requires admitted exact predecessors and disjoint paths and locks.
  - Execute cheap structural checks before integration/provider tests; reuse only current BCF-qualified dependency-bound evidence.
  - Target retention 365 days, explicit 90-day fallback, 31-day floor; holds survive deletion and capacity pressure.
  - Content is source-emitted only; raw API bodies off; no SSO, Compliance API, premium services, persistent controller or WORM/completeness claims.
  - Runtime evidence goes to .artifacts/ with durable phase references; review reports go to audits/. Never author verified or closed. (non-authoritative planned output; capture exact digest before use)
  - Future commands and symbols qualify during admission; acceptance obligations are planned, never evidence of unbuilt behavior.
global_gates:
  - {id: G1, name: foundation_closeout, applies_before: P02, required_completion_criteria: [Canonical validation and exact evidence qualify P01; phase rollover reconciles ledger and MEMORY.]}
  - {id: G2, name: standard_v3_before_construction, applies_before: P02, required_completion_criteria: ['Real mandatory gates, causal negatives, semantic inventories, runner/provider authority and exact candidate qualify canonical promote --check then --apply.', Reconcile and CI graph validation/audit plus provider checks pass; pause before any substantial construction., 'If qualification requires substantial construction, stop blocked in P01 and report exact missing prerequisites.']}
