delivery_contract:
  tightly_scoped_deliverables:
  - Construct reproducible single-host Linux Docker Compose OSS services with restricted interfaces.
  - Implement ClickHouse DDL, idempotent migrations, read-only reporting and restricted ingestion users.
  - Configure OTLP/HTTP proto+JSON and optional gRPC with authenticated local/remote receiver boundary.
  - Persist source-faithful typed OTLP with bounded segments, manifest identities and verifiable replay.
  - "Configure tested Collector\u2192ClickHouse pipelines for logs, traces and metrics."
  - Qualify WAL/queue, backpressure, retries, deduplication and stage reconciliation across archive/SQL.
  parallelizable_workstreams:
  - id: P03-WS1
    name: Qualified dependency-first packets; isolated resources and no overlapping write roots
  hard_dependencies:
  - P01
  - P02
  docker_first_local_runtime: Isolated Linux Docker Compose projects for component tests; pinned local Python for planning
    checks
  completeness_standard: full_completeness_for_declared_scope
