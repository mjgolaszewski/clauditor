      allowed_when:
      - single_commit_fix
      - no_public_contract_change
      - no_security_scope_change
    full:
      required_when:
      - default_branch_red_ci
      - release_blocking_regression
      - security_or_expiring_external_breakage
  open_records: []
  remediation_history: []
operator_requirements_choices_disambiguations:
- type: decision
  statement: all governance, memory, specs, plans, workitem ledgers, and phase logs remain YAML-native
- type: authorization
  statement: Adopt canonical roadmap; attempt Standard profile contract 3.0 before substantial construction, then pause. If
    actual prerequisites require construction, stop and report blockers.
- type: authorization
  statement: User now authorizes construction through genuine Standard-v3 promotion eligibility, promotion and verification,
    push to origin, then end turn. No product release.
active_delivery_priorities:
  current_tranche:
  - Construct and test the smallest qualification slice; promote and verify Standard 3.0, push origin, then stop.
release_trains:
