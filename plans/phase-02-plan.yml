delivery_contract:
  tightly_scoped_deliverables:
  - Bind owner intent, baseline and change authority before constructing dependent contracts.
  - Qualify Cowork, Claude Code, API and SDK signal/content capabilities and source enrollment prerequisites.
  - Qualify free self-hosted image/plugin versions, dependencies, stability and ClickHouse exporter behavior.
  - Fix local admin/viewer, secret, SQL, content privacy and OSS audit expectations.
  - Reconcile canonical semantics, independent required paths and typed state/edge exclusions.
  - Build anonymized fixtures for OTLP signals, content limits and provider source types.
  - Contract OTLP authorization, partial success, durable queues and multi-stage receipts.
  - Contract semantically typed OTLP preservation, ClickHouse projections and deduplication.
  - Define 365/90/31-day retention, holds, export custody and capacity downgrade controls.
  - Contract reviewer SQL access, correlation confidence, native Grafana capability and bounded exports.
  - Contract observed compliance and health alert predicates, notification and uncertainty.
  - Specify one-host runtime budgets, persistent volumes, backup/restore and host TLS responsibilities.
  - Review and reconcile approved candidate ownership with existing BCF root authorities without destructive replacement.
  parallelizable_workstreams:
  - id: P02-WS1
    name: Qualified dependency-first packets; isolated resources and no overlapping write roots
  hard_dependencies:
  - P01
  docker_first_local_runtime: Isolated Linux Docker Compose projects for component tests; pinned local Python for planning
    checks
  completeness_standard: full_completeness_for_declared_scope
