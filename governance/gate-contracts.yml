    - {id: runtime-evidence-outside-tests, mutation: {path: spec/clauditor/v1/construction/plan.json, search: .artifacts/clauditor/CL-WO-027/report.json, replace: tests/e2e/first-vertical/report.json}, oracle: {kind: *a27, node_ids: ['backend.tests.test_contracts::test_runtime_evidence_destinations']}}
  governance-exposure-scan:
