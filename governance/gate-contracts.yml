      env: {PYTHONPATH: 'backend/src:tools:.'}
      required_env: []
    evidence:
      kind: test_suite
      test_contract:
        junit_xml: .artifacts/junit/architecture-context-membership.xml # non-authoritative until captured by BCF
        expected_node_manifest: governance/test-manifests/architecture-context-membership.txt
        expected_nodes_mode: exact
        min_collected: 1
        min_executed: 1
        max_skipped: 0
        selectors: ['backend/tests/architecture/test_boundaries_ast.py::test_production_modules_map_to_exactly_one_bounded_context']
        artifact_binding: non_authoritative_until_captured
    negative_controls:
    - id: architecture-context-membership-rejects-causal-mutation
      mutation:
        path: architecture-boundaries.yml
        yaml_path: architecture.bounded_contexts.context_root_tokens
        value: []
      oracle:
        kind: test_node_failure
        node_ids: ['backend.tests.architecture.test_boundaries_ast::test_production_modules_map_to_exactly_one_bounded_context']
