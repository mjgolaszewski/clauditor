document: {kind: gate_contract_registry, version: '2.0', path: governance/gate-contracts.yml}
schema_version: '2.0'
profile_contract_version: '3.0'
target_profile: standard
execution_policy: {default_timeout_seconds: 1800}
interpreter_contract: {dependency_source: requirements-governance.txt}
claim_model:
  version: '1.0'
  dependency_sets:
    subject: [backend/src/**, config/**, deploy/**, spec/**, plans/**]
    detectors: [scripts/**, tools/**]
    tests: [backend/tests/**, governance/test-manifests/**]
    toolchain: [requirements-*.txt, pyproject.toml]
    trust: [AGENTS.yml, governance/**, .github/**, &a32 MEMORY.yml, phases/**, audits/**, CHANGELOG.md]
  execution_groups:
    preflight:
      producer: &a16 preflight
      captured_by_preflight: true
      claims: [governance-contracts-valid, governance-exposure-clean, source-syntax-format, semantic-ownership-valid]
    architecture-context-membership:
      producer: &a1 architecture-context-membership
      claims: [*a1]
    architecture-cqrs-side:
      producer: &a2 architecture-cqrs-side
      claims: [*a2]
    architecture-duplication:
      producer: &a3 architecture-duplication
      claims: [*a3]
    architecture-import-boundaries:
      producer: &a4 architecture-import-boundaries
      claims: [*a4]
    architecture-layer-membership:
      producer: &a5 architecture-layer-membership
      claims: [*a5]
    architecture-module-size:
      producer: &a6 architecture-module-size
      claims: [*a6]
    architecture-router-thinness:
      producer: &a7 architecture-router-thinness
      claims: [*a7]
    architecture-test:
      producer: &a8 architecture-test
      claims: [*a8]
    contract-test:
      producer: &a9 contract-test
      claims: [*a9]
    runtime-smoke:
      producer: &a10 runtime-smoke
      claims: [*a10]
    security-dependency-audit:
      producer: &a11 security-dependency-audit
      claims: [*a11]
    security-sbom:
      producer: &a12 security-sbom
      claims: [*a12]
    security-secret-scan:
      producer: &a13 security-secret-scan
      claims: [*a13]
    security-vulnerability-scan:
      producer: &a14 security-vulnerability-scan
      claims: [*a14]
    test:
      producer: test
      claims: [test]
    typecheck:
      producer: &a15 typecheck
      claims: [*a15]
  claims:
    governance-contracts-valid:
      truth: governance-validate qualifies the declared current source/runtime slice on the exact subject; no full MVP or release claim
      execution_group: *a16
      legacy_gate: &a42 governance-validate
      dependencies:
        subject: &a17 [subject]
        detector: &a18 [detectors]
        test_population: &a19 [tests]
        toolchain: &a20 [toolchain]
        trust: &a21 [trust]
      qualification_scope: none
      profiles: &a22 [normal, regulated]
    governance-exposure-clean:
      truth: governance-exposure-scan qualifies the declared current source/runtime slice on the exact subject; no full MVP or release claim
      execution_group: *a16
      legacy_gate: &a43 governance-exposure-scan
      dependencies:
        subject: *a17
        detector: *a18
        test_population: *a19
        toolchain: *a20
        trust: *a21
      qualification_scope: none
      profiles: *a22
    source-syntax-format:
