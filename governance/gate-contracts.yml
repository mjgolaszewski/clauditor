gates:
  architecture-context-membership:
    invocation: {argv: [python3, &a23 tools/qualification/tests.py, *a1], cwd: ., env: {PYTHONPATH: &a24 'backend/src:tools:.'}, required_env: []}
    evidence: {kind: &a25 test_suite, test_contract: {junit_xml: .artifacts/junit/architecture-context-membership.xml, expected_node_manifest: governance/test-manifests/architecture-context-membership.txt, expected_nodes_mode: exact, min_collected: 1, min_executed: 1, max_skipped: 0, selectors: ['backend/tests/architecture/test_boundaries_ast.py::test_production_modules_map_to_exactly_one_bounded_context'], artifact_binding: &a26 non_authoritative_until_captured}}
    negative_controls:
    - {id: architecture-context-membership-rejects-causal-mutation, mutation: {path: &a29 architecture-boundaries.yml, yaml_path: architecture.bounded_contexts.context_root_tokens, value: []}, oracle: {kind: &a27 test_node_failure, node_ids: ['backend.tests.architecture.test_boundaries_ast::test_production_modules_map_to_exactly_one_bounded_context']}}
  architecture-cqrs-side:
    invocation: {argv: [python3, *a23, *a2], cwd: ., env: {PYTHONPATH: *a24}, required_env: []}
