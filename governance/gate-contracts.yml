    evidence: {kind: *a25, test_contract: {junit_xml: .artifacts/junit/architecture-router-thinness.xml, expected_node_manifest: governance/test-manifests/architecture-router-thinness.txt, expected_nodes_mode: exact, min_collected: 1, min_executed: 1, max_skipped: 0, selectors: ['backend/tests/architecture/test_boundaries_ast.py::test_routers_remain_thin_transport_adapters'], artifact_binding: *a26}}
