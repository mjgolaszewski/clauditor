    negative_controls:
    - {id: architecture-cqrs-side-rejects-causal-mutation, mutation: {path: backend/src/clauditor/archive/use_cases/queries/inspect_archive.py, search: '    return decoder.decode(signal, record)', replace: "    decoder.save('forbidden mutation')\n    return decoder.decode(signal, record)"}, oracle: {kind: *a27, node_ids: ['backend.tests.architecture.test_boundaries_ast::test_cqrs_query_side_does_not_mutate_state']}}
  architecture-duplication:
    invocation: {argv: [python3, *a23, *a3], cwd: ., env: {PYTHONPATH: *a24}, required_env: []}
    evidence: {kind: *a25, test_contract: {junit_xml: .artifacts/junit/architecture-duplication.xml, expected_node_manifest: governance/test-manifests/architecture-duplication.txt, expected_nodes_mode: exact, min_collected: 2, min_executed: 2, max_skipped: 0, selectors: ['backend/tests/architecture/test_boundaries_ast.py::test_bounded_context_duplication_is_explicit', 'backend/tests/architecture/test_boundaries_ast.py::test_shared_abstraction_duplication_has_minimum_real_call_sites'], artifact_binding: *a26}}
    negative_controls:
    - {id: architecture-duplication-rejects-causal-mutation, mutation: {path: &a28 backend/src/clauditor/archive/domain/envelope.py, search: "\"\"\"A decoded source envelope remains distinct from indexing or durable receipt.\"\"\"\nfrom dataclasses import dataclass\nfrom typing import Literal\n\nSignal = Literal['logs', 'traces', 'metrics']\n\n\n@dataclass(frozen=True)\nclass ArchiveEnvelope:\n    \"\"\"Source-faithful protobuf bytes; no claim of authenticated source completeness.\"\"\"\n\n    signal: Signal\n    protobuf: bytes\n\n\ndef envelope(signal: Signal, protobuf: bytes) -> ArchiveEnvelope:\n    \"\"\"Construct only decoded, nonempty signal payloads.\"\"\"\n    if signal not in ('logs', 'traces', 'metrics') or not protobuf:\n        raise ValueError('empty or unsupported OTLP envelope')\n    return ArchiveEnvelope(signal=signal, protobuf=protobuf)\n", replace: "\"\"\"A decoded source envelope remains distinct from indexing or durable receipt.\"\"\"\nfrom dataclasses import dataclass\nfrom typing import Literal\n\nSignal = Literal['logs', 'traces', 'metrics']\n\n\n@dataclass(frozen=True)\nclass ArchiveEnvelope:\n    \"\"\"Source-faithful protobuf bytes; no claim of authenticated source completeness.\"\"\"\n\n    signal: Signal\n    protobuf: bytes\n\n\ndef envelope(signal: Signal, protobuf: bytes) -> ArchiveEnvelope:\n    \"\"\"Construct only decoded, nonempty signal payloads.\"\"\"\n    if signal not in ('logs', 'traces', 'metrics') or not protobuf:\n        raise ValueError('empty or unsupported OTLP envelope')\n    return ArchiveEnvelope(signal=signal, protobuf=protobuf)\n\n\"\"\"A decoded source envelope remains distinct from indexing or durable receipt.\"\"\"\nfrom dataclasses import dataclass\nfrom typing import Literal\n\nSignal = Literal['logs', 'traces', 'metrics']\n\n\n@dataclass(frozen=True)\nclass ArchiveEnvelope:\n    \"\"\"Source-faithful protobuf bytes; no claim of authenticated source completeness.\"\"\"\n\n    signal: Signal\n    protobuf: bytes\n\n\ndef envelope(signal: Signal, protobuf: bytes) -> ArchiveEnvelope:\n    \"\"\"Construct only decoded, nonempty signal payloads.\"\"\"\n    if signal not in ('logs', 'traces', 'metrics') or not protobuf:\n        raise ValueError('empty or unsupported OTLP envelope')\n    return ArchiveEnvelope(signal=signal, protobuf=protobuf)\n"}, oracle: {kind: *a27, node_ids: ['backend.tests.architecture.test_boundaries_ast::test_bounded_context_duplication_is_explicit']}}
  architecture-import-boundaries:
    invocation: {argv: [python3, *a23, *a4], cwd: ., env: {PYTHONPATH: *a24}, required_env: []}
    evidence: {kind: *a25, test_contract: {junit_xml: .artifacts/junit/architecture-import-boundaries.xml, expected_node_manifest: governance/test-manifests/architecture-import-boundaries.txt, expected_nodes_mode: exact, min_collected: 4, min_executed: 4, max_skipped: 0, selectors: ['backend/tests/architecture/test_boundaries_ast.py::test_domain_layer_does_not_import_frameworks_clients_or_outer_layers', 'backend/tests/architecture/test_boundaries_ast.py::test_use_cases_do_not_import_http_objects_or_infrastructure_clients', 'backend/tests/architecture/test_boundaries_ast.py::test_ports_do_not_import_sqlalchemy_or_concrete_adapters', 'backend/tests/architecture/test_boundaries_ast.py::test_routers_do_not_import_persistence_models_or_external_clients_directly'], artifact_binding: *a26}}
    negative_controls:
    - {id: architecture-import-boundaries-rejects-causal-mutation, mutation: {path: *a28, search: &a35 from dataclasses import dataclass, replace: 'from dataclasses import dataclass

          import opentelemetry'}, oracle: {kind: *a27, node_ids: ['backend.tests.architecture.test_boundaries_ast::test_domain_layer_does_not_import_frameworks_clients_or_outer_layers']}}
  architecture-layer-membership:
    invocation: {argv: [python3, *a23, *a5], cwd: ., env: {PYTHONPATH: *a24}, required_env: []}
    evidence: {kind: *a25, test_contract: {junit_xml: .artifacts/junit/architecture-layer-membership.xml, expected_node_manifest: governance/test-manifests/architecture-layer-membership.txt, expected_nodes_mode: exact, min_collected: 1, min_executed: 1, max_skipped: 0, selectors: ['backend/tests/architecture/test_boundaries_ast.py::test_production_modules_map_to_exactly_one_layer'], artifact_binding: *a26}}
