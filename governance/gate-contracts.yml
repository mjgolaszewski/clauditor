  contract-test:
    invocation: {argv: [python3, *a23, *a9], cwd: ., env: {PYTHONPATH: *a24}, required_env: []}
    evidence: {kind: *a25, test_contract: {junit_xml: .artifacts/junit/contract-test.xml, expected_node_manifest: governance/test-manifests/contract-test.txt, expected_nodes_mode: exact, min_collected: 5, min_executed: 5, max_skipped: 0, selectors: [backend/tests/test_contracts.py], artifact_binding: *a26}}
    negative_controls:
    - {id: contract-test-rejects-causal-mutation, mutation: {path: &a37 config/otel/qualification.yml, yaml_path: receivers.otlp.protocols.http.auth.authenticator, value: missing-authenticator}, oracle: {kind: *a27, node_ids: ['backend.tests.test_contracts::test_otlp_receivers_require_authentication']}}
