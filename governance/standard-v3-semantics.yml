contracts:
  semantic_families:
    schema_version: '1.0'
    document:
      kind: semantic_family_registry
      id: clauditor-semantic-families
      version: 1.0.0
      status: active
      path: governance/semantic-families.yml
    families:
    - id: ci_graph_compilation
      significance: authoritative
      ownership_required: true
      canonical_semantic_ids:
      - governance.ci-graph-compilation.v1
      material_selectors:
        source_paths:
        - scripts/_bcf_runtime/ci_graph_contracts.py
        symbols:
        - scripts/_bcf_runtime/ci_graph_contracts.py::CompiledCIGraph
        secondary_paths: []
      responsibilities:
        construction:
        - scripts/_bcf_runtime/ci_graph_contracts.py::validate_ci_graph
        decoding:
        - scripts/_bcf_runtime/ci_graph_contracts.py::validate_ci_graph
        transition: []
        projection: []
    - id: evidence_session_identity
      significance: authoritative
      ownership_required: true
      canonical_semantic_ids:
      - governance.evidence-session.v1
      material_selectors:
        source_paths:
        - scripts/_bcf_runtime/evidence_sessions.py
        symbols:
        - scripts/_bcf_runtime/evidence_sessions.py::EvidenceSession
        secondary_paths: []
      responsibilities:
        construction:
        - scripts/_bcf_runtime/evidence_sessions.py::allocate_session
        decoding:
        - scripts/_bcf_runtime/evidence_sessions.py::load_session
        transition: []
        projection: []
    - id: evidence_receipt_admission
      significance: authoritative
      ownership_required: true
      canonical_semantic_ids:
      - governance.evidence-receipt-admission.v1
      material_selectors:
        source_paths:
        - scripts/_bcf_runtime/truth_receipts.py
        symbols:
        - scripts/_bcf_runtime/truth_receipts.py::ReceiptAdmission
        secondary_paths: []
      responsibilities:
        construction:
        - scripts/_bcf_runtime/truth_receipts.py::_receipt_admission_identity
        decoding:
        - scripts/_bcf_runtime/truth_receipts.py::_receipt_admission_identity
        transition: []
        projection: []
    - id: archive_envelope
      significance: authoritative
      ownership_required: true
      canonical_semantic_ids:
      - clauditor.archive-envelope.v1
      material_selectors:
        source_paths:
        - backend/src/clauditor/archive/domain/envelope.py
        symbols:
        - backend/src/clauditor/archive/domain/envelope.py::ArchiveEnvelope
        secondary_paths: []
      responsibilities:
        construction:
        - backend/src/clauditor/archive/domain/envelope.py::envelope
        decoding:
        - backend/src/clauditor/archive/infrastructure/otlp_json.py::decode_json
        transition: []
        projection: []
    migrations: []
  application_operations:
    schema_version: '1.0'
    document:
      kind: application_operation_registry
      id: clauditor-application-operations
      version: 1.0.0
      status: active
      path: governance/application-operations.yml
    populations:
    - id: archive_cli
      adapter: python_mapping
      source: backend/src/clauditor/archive/infrastructure/inspect_cli.py
      symbol: PUBLIC_OPERATIONS
      public_only: true
    - id: runtime_qualification
      adapter: python_mapping
      source: tools/qualification/runtime.py
      symbol: PUBLIC_OPERATIONS
      public_only: true
    - id: quality_qualification
      adapter: python_mapping
      source: tools/qualification/quality.py
      symbol: PUBLIC_OPERATIONS
      public_only: true
    - id: test_qualification
      adapter: python_mapping
      source: tools/qualification/tests.py
      symbol: PUBLIC_OPERATIONS
      public_only: true
    - id: plan_validation
      adapter: python_mapping
      source: scripts/check_build_plan.py
      symbol: PUBLIC_OPERATIONS
      public_only: true
    - id: spec_validation
      adapter: python_mapping
      source: spec/clauditor/v1/tools/check.py
      symbol: PUBLIC_OPERATIONS
      public_only: true
    - id: construction_validation
      adapter: python_mapping
      source: spec/clauditor/v1/construction/tools/check.py
      symbol: PUBLIC_OPERATIONS
      public_only: true
    operations:
    - id: clauditor.operation.inspect-archive.v1
      population: archive_cli
      population_key: inspect-archive
      family: archive_envelope
      bounded_context: archive
      entrypoints:
      - backend/src/clauditor/archive/infrastructure/inspect_cli.py::main
      semantic_kind: query
      authoritative_read: true
      authoritative_mutation: false
      authority_conferral: false
      produces_projection: false
      model_callable: false
      allowed_mutation_ports: []
      allowed_authority_ports: []
      non_authoritative_output_effects: []
    - id: clauditor.operation.runtime-smoke.v1
      population: runtime_qualification
      population_key: runtime-smoke
      family: archive_envelope
      bounded_context: qualification
      entrypoints:
      - tools/qualification/runtime.py::main
      semantic_kind: execution
      authoritative_read: true
      authoritative_mutation: false
      authority_conferral: false
      produces_projection: false
      model_callable: false
      allowed_mutation_ports: []
      allowed_authority_ports: []
      non_authoritative_output_effects:
      - subprocess::module.run
      - tools/qualification/runtime.py::output.parent.mkdir
      - tools/qualification/runtime.py::output.write_text
    - id: clauditor.operation.quality.v1
      population: quality_qualification
      population_key: quality
      family: archive_envelope
      bounded_context: qualification
      entrypoints:
      - tools/qualification/quality.py::main
      semantic_kind: execution
      authoritative_read: true
      authoritative_mutation: false
      authority_conferral: false
      produces_projection: false
      model_callable: false
      allowed_mutation_ports: []
      allowed_authority_ports: []
      non_authoritative_output_effects:
      - subprocess::module.run
      - tools/qualification/quality.py::path.parent.mkdir
      - tools/qualification/quality.py::path.write_text
      - tools/qualification/quality.py::(ROOT / '.artifacts').mkdir
      - tools/qualification/quality.py::output.write_text
    - id: clauditor.operation.tests.v1
      population: test_qualification
      population_key: tests
      family: archive_envelope
      bounded_context: qualification
      entrypoints:
      - tools/qualification/tests.py::main
      semantic_kind: execution
      authoritative_read: true
      authoritative_mutation: false
      authority_conferral: false
      produces_projection: false
      model_callable: false
      allowed_mutation_ports: []
      allowed_authority_ports: []
      non_authoritative_output_effects:
      - tools/qualification/tests.py::(ROOT / '.artifacts/junit').mkdir # non-authoritative until captured by BCF
      - pytest::module.main
    - id: clauditor.operation.validate-plan.v1
      population: plan_validation
      population_key: validate-plan
      family: archive_envelope
      bounded_context: qualification
      entrypoints:
      - scripts/check_build_plan.py::main
      semantic_kind: validation
      authoritative_read: true
      authoritative_mutation: false
      authority_conferral: false
      produces_projection: false
      model_callable: false
      allowed_mutation_ports: []
      allowed_authority_ports: []
      non_authoritative_output_effects:
      - scripts/check_build_plan.py::self_test
    - id: clauditor.operation.validate-spec.v1
      population: spec_validation
      population_key: validate-spec
      family: archive_envelope
      bounded_context: qualification
      entrypoints:
      - spec/clauditor/v1/tools/check.py::main
      semantic_kind: execution
      authoritative_read: true
      authoritative_mutation: false
      authority_conferral: false
      produces_projection: false
      model_callable: false
      allowed_mutation_ports: []
      allowed_authority_ports: []
      non_authoritative_output_effects:
      - spec/clauditor/v1/tools/check.py::mutation_controls
      - spec/clauditor/v1/tools/check.py::outdir.mkdir
      - spec/clauditor/v1/tools/check.py::(outdir / path).write_bytes
    - id: clauditor.operation.validate-construction.v1
      population: construction_validation
      population_key: validate-construction
      family: archive_envelope
      bounded_context: qualification
      entrypoints:
      - spec/clauditor/v1/construction/tools/check.py::main
      semantic_kind: execution
      authoritative_read: true
      authoritative_mutation: false
      authority_conferral: false
      produces_projection: false
      model_callable: false
      allowed_mutation_ports: []
      allowed_authority_ports: []
      non_authoritative_output_effects:
      - spec/clauditor/v1/construction/tools/check.py::mutations
      - spec/clauditor/v1/construction/tools/check.py::dest.mkdir
      - spec/clauditor/v1/construction/tools/check.py::(dest / name).write_bytes
      - spec/clauditor/v1/construction/tools/check.py::(dest / 'manifest.json').write_text
    migrations: []
  canonical_representations:
    document:
      kind: canonical_representation_registry
      id: clauditor-canonical-representations
      version: 1.0.0
      status: active
      path: governance/canonical-representations.yml
    enforcement:
      phase: P01
      default_mode: declared_families_blocking
      declared_families:
      - ci_graph_compilation
      - evidence_receipt_admission
      - evidence_session_identity
      - archive_envelope
      blocking_semantic_ids:
      - governance.ci-graph-compilation.v1
      - governance.evidence-receipt-admission.v1
      - governance.evidence-session.v1
      - clauditor.archive-envelope.v1
      report_path: .artifacts/semantic-ownership/report.json # non-authoritative until captured by BCF
      unresolved_dynamic_policy: report
    source_authority:
      discovery_precedes_registry_load: true
      python_engine: scripts/_bcf_runtime/semantic_ownership_inventory.py
      typescript_engine: not_applicable_until_declared_by_consumer
      cross_language_trace: not_applicable_until_declared_by_consumer
      completeness_authority: independent_exact_tree_source_inventory
      python_import_roots:
      - backend/src
      - scripts
      - tools
      - spec
      authoritative_python_roots:
      - scripts/_bcf_runtime
      - backend/src/clauditor
      - tools/qualification
      - scripts/check_build_plan.py
      - spec/clauditor/v1/tools/check.py
      - spec/clauditor/v1/construction/tools/check.py
      generated_mirror_roots: []
    representations:
    - semantic_id: governance.ci-graph-compilation.v1
      family: ci_graph_compilation
      schema_version: 1
      lifecycle: enforced
      finding_ids: []
      canonical_type:
        language: python
        symbol: scripts/_bcf_runtime/ci_graph_contracts.py::CompiledCIGraph
      authoritative_owner:
        symbol: scripts/_bcf_runtime/ci_graph_contracts.py::validate_ci_graph
        owner_kind: compiler
      authorized_constructors_and_factories:
      - scripts/_bcf_runtime/ci_graph_contracts.py::validate_ci_graph
      authorized_pure_delegates:
      - scripts/_bcf_runtime/ci_graph_render.py::render_ci_graph
      hostile_boundary_decoder:
        symbol: scripts/_bcf_runtime/ci_graph_contracts.py::validate_ci_graph
        trust_boundary: project graph registered extensions and controller selection
      field_invariants:
      - field: workflows
        invariant: one push authority complete exact fan-in and unique semantic owners
      - field: inputs
        invariant: registered extension and controller source bytes are content bound
      permitted_defaults_and_single_application_point: []
      accepted_aliases_and_single_ingress_boundary: []
      persistence_codec_and_envelope:
        applicability: required
        codec_symbol: scripts/_bcf_runtime/ci_graph_render.py::render_ci_graph
        semantic_id: governance.ci-graph-compilation.v1
        schema_version: 1
        exact_byte_format: deterministic YAML with provenance header
        integrity_algorithm: SHA-256 and schema validation
        identity_bindings:
        - graph_sha256
        - extension_sha256
        - input_sha256
        - workflow_path
        - job_id
        - semantic_role
        migration_dispatch: graph schema_version
      protocol_translations: []
      intentional_projections: []
      declared_consumer_layers_and_sinks:
        read:
        - scripts/_bcf_runtime/ci_graph_commands.py::run_graph_command
        authorization:
        - scripts/_bcf_runtime/governance_validation/runner.py::validate_repo_root
        persistence:
        - scripts/_bcf_runtime/ci_graph_render.py::apply_ci_graph
        cache: []
        queue: []
        network: []
        api: []
        browser: []
      generated_source_authority:
        authoritative_roots:
        - scripts/_bcf_runtime/ci_graph_contracts.py
        - scripts/_bcf_runtime/ci_graph_render.py
        generated_mirrors: []
        generator: .github/scripts/build_pack_manifest.py::main
        parity_proof: graph render check
      migration_policy:
        source_versions: []
        destination_version: 1
        owner: scripts/_bcf_runtime/ci_graph_contracts.py::validate_ci_graph
        runtime_exclusion: generated workflow bytes have no independent authority
        removal_condition: reviewed graph schema successor
      narrow_suppressions: []
    - semantic_id: governance.evidence-session.v1
      family: evidence_session_identity
      schema_version: 1
      lifecycle: enforced
      finding_ids: []
      canonical_type:
        language: python
        symbol: scripts/_bcf_runtime/evidence_sessions.py::EvidenceSession
      authoritative_owner:
        symbol: scripts/_bcf_runtime/evidence_sessions.py::allocate_session
        owner_kind: constructor
      authorized_constructors_and_factories:
      - scripts/_bcf_runtime/evidence_sessions.py::allocate_session
      - scripts/_bcf_runtime/evidence_sessions.py::load_session
      authorized_pure_delegates: []
      hostile_boundary_decoder:
        symbol: scripts/_bcf_runtime/evidence_sessions.py::load_session
        trust_boundary: downloaded or caller-supplied session manifest bytes
      field_invariants:
      - field: session_id
        invariant: at least 128 bits and identical to the private session directory name
      - field: manifest
        invariant: immutable bytes bind exact subject profile producer run attempt and closed inventories
      permitted_defaults_and_single_application_point: []
      accepted_aliases_and_single_ingress_boundary: []
      persistence_codec_and_envelope:
        applicability: required
        codec_symbol: scripts/_bcf_runtime/evidence_sessions.py::load_session
        semantic_id: governance.evidence-session.v1
        schema_version: 1
        exact_byte_format: canonical sorted JSON
        integrity_algorithm: SHA-256
        identity_bindings:
        - commit_sha
        - tree_sha
        - session_id
        - run_id
        - run_attempt
        migration_dispatch: schema_version
      protocol_translations: []
      intentional_projections: []
      declared_consumer_layers_and_sinks:
        read:
        - scripts/_bcf_runtime/truth_sessions.py::verify_evidence_sessions
        authorization: []
        persistence:
        - scripts/_bcf_runtime/evidence_sessions.py::bind_session
        cache: []
        queue: []
        network: []
        api: []
        browser: []
      generated_source_authority:
        authoritative_roots:
        - scripts/_bcf_runtime/evidence_sessions.py
        generated_mirrors: []
        generator: bcf install
        parity_proof: pack manifest SHA-256
      migration_policy:
        source_versions: []
        destination_version: 1
        owner: scripts/_bcf_runtime/evidence_sessions.py::load_session
        runtime_exclusion: schema-version dispatch only
        removal_condition: superseded by a reviewed evidence-session schema
      narrow_suppressions: []
    - semantic_id: governance.evidence-receipt-admission.v1
      family: evidence_receipt_admission
      schema_version: 1
      lifecycle: enforced
      finding_ids: []
      canonical_type:
        language: python
        symbol: scripts/_bcf_runtime/truth_receipts.py::ReceiptAdmission
      authoritative_owner:
        symbol: scripts/_bcf_runtime/truth_receipts.py::_receipt_admission_identity
        owner_kind: hostile_decoder
      authorized_constructors_and_factories:
      - scripts/_bcf_runtime/truth_receipts.py::_receipt_admission_identity
      authorized_pure_delegates:
      - scripts/_bcf_runtime/truth_receipts.py::_apply_receipt_identity_validation
      hostile_boundary_decoder:
        symbol: scripts/_bcf_runtime/truth_receipts.py::_receipt_admission_identity
        trust_boundary: untrusted receipt bundle before grouping
      field_invariants:
      - field: evidence_identity
        invariant: unique per exact subject and session
      - field: execution_slot
        invariant: unique gate producer workflow attempt and partition
      - field: collision
        invariant: all members invalid before selection
      permitted_defaults_and_single_application_point:
      - field: matrix
        value: '{}'
        owner: scripts/_bcf_runtime/truth_receipts.py::_receipt_admission_identity
      - field: session
        value: sessionless
        owner: scripts/_bcf_runtime/truth_receipts.py::_receipt_admission_identity
      accepted_aliases_and_single_ingress_boundary: []
      persistence_codec_and_envelope:
        applicability: not_applicable
        codec_symbol: scripts/_bcf_runtime/truth_receipts.py::_receipt_admission_identity
        semantic_id: governance.evidence-receipt-admission.v1
        schema_version: 1
        exact_byte_format: frozen normalized value
        integrity_algorithm: exact pre-aggregation collision comparison
        identity_bindings:
        - subject
        - session
        - evidence_id
        - gate_id
        - kind
        - producer
        - workflow
        - run_attempt
        - matrix_or_partition
        - invocation
        migration_dispatch: receipt schema and profile contract
      protocol_translations: []
      intentional_projections: []
      declared_consumer_layers_and_sinks:
        read:
        - scripts/_bcf_runtime/truth_receipts.py::load_receipts
        authorization:
        - scripts/_bcf_runtime/truth_receipts.py::_apply_receipt_identity_validation
        persistence: []
        cache: []
        queue: []
        network: []
        api: []
        browser: []
      generated_source_authority:
        authoritative_roots:
        - scripts/_bcf_runtime/truth_receipts.py
        generated_mirrors: []
        generator: bcf install
        parity_proof: pack manifest SHA-256
      migration_policy:
        source_versions:
        - 2
        destination_version: 1
        owner: scripts/_bcf_runtime/truth_receipts.py::_receipt_admission_identity
        runtime_exclusion: receipt bytes unchanged
        removal_condition: reviewed successor
      narrow_suppressions: []
    - semantic_id: clauditor.archive-envelope.v1
      family: archive_envelope
      schema_version: 1
      lifecycle: enforced
      finding_ids: []
      canonical_type:
        language: python
        symbol: backend/src/clauditor/archive/domain/envelope.py::ArchiveEnvelope
      authoritative_owner:
        symbol: backend/src/clauditor/archive/domain/envelope.py::envelope
        owner_kind: constructor
      authorized_constructors_and_factories:
      - backend/src/clauditor/archive/domain/envelope.py::envelope
      authorized_pure_delegates: []
      hostile_boundary_decoder:
        symbol: backend/src/clauditor/archive/infrastructure/otlp_json.py::decode_json
        trust_boundary: Untrusted OTLP JSON archive record; official protobuf validation and OTLP hex-ID normalization
      field_invariants:
      - field: signal
        invariant: One of logs, traces or metrics; never inferred provider completeness
      - field: protobuf
        invariant: Nonempty standard protobuf bytes preserving supported source-emitted OTLP types; not an archive durability
          receipt
      permitted_defaults_and_single_application_point: []
      accepted_aliases_and_single_ingress_boundary: []
      persistence_codec_and_envelope:
        applicability: required
        codec_symbol: backend/src/clauditor/archive/infrastructure/otlp_json.py::decode_json
        semantic_id: clauditor.archive-envelope.v1
        schema_version: 1
        exact_byte_format: Qualified OTLP JSON file record decoded into deterministic standard protobuf
        integrity_algorithm: SHA-256
        identity_bindings:
        - signal
        - protobuf
        migration_dispatch: Pinned Collector v0.148.0 and protobuf dependency; requalify any format/version change
      protocol_translations: []
      intentional_projections: []
      declared_consumer_layers_and_sinks:
        read:
        - backend/src/clauditor/archive/use_cases/queries/inspect_archive.py::inspect_archive
        authorization: []
        persistence: []
        cache: []
        queue: []
        network: []
        api: []
        browser: []
      generated_source_authority:
        authoritative_roots:
        - backend/src/clauditor/archive/domain/envelope.py
        - backend/src/clauditor/archive/infrastructure/otlp_json.py
        generated_mirrors: []
        generator: not_applicable
        parity_proof: Typed archive conformance tests; no generated source mirror
      migration_policy:
        source_versions: []
        destination_version: 1
        owner: backend/src/clauditor/archive/domain/envelope.py::envelope
        runtime_exclusion: Does not certify receipt durability, complete provider delivery, deduplication, retention or WORM
        removal_condition: Reviewed successor with typed conformance evidence
      narrow_suppressions: []
unresolved_classifications: []
