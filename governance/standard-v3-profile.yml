    negative_controls:
    - id: architecture-duplication-rejects-causal-mutation
      mutation: {path: backend/src/clauditor/archive/infrastructure/otlp_json.py, search: "\"\"\"Decode the qualified Collector OTLP JSON file representation with official types.\"\"\"\nimport base64\nimport json\nfrom typing import Any\n\nfrom clauditor.archive.domain.envelope import ArchiveEnvelope, Signal, envelope\nfrom google.protobuf.json_format import ParseDict\nfrom google.protobuf.message import Message\nfrom opentelemetry.proto.collector.logs.v1.logs_service_pb2 import ExportLogsServiceRequest\nfrom opentelemetry.proto.collector.metrics.v1.metrics_service_pb2 import ExportMetricsServiceRequest\nfrom opentelemetry.proto.collector.trace.v1.trace_service_pb2 import ExportTraceServiceRequest\n\nMAX_RECORD_BYTES = 4 * 1024 * 1024\nSIGNALS: dict[str, type[Message]] = {\n    'logs': ExportLogsServiceRequest,\n    'metrics': ExportMetricsServiceRequest,\n    'traces': ExportTraceServiceRequest,\n}\n\n\ndef decode_json(signal: Signal, record: bytes) -> ArchiveEnvelope:\n    \"\"\"Reject malformed/unknown fields; preserve OTLP numeric and AnyValue types.\"\"\"\n    if len(record) > MAX_RECORD_BYTES:\n        raise ValueError('archive record exceeds limit')\n    if signal not in SIGNALS:\n        raise ValueError('unsupported signal')\n    value: Any = json.loads(record)\n    if not isinstance(value, dict) or not value:\n        raise ValueError('expected nonempty OTLP object')\n    normalize_ids(signal, value)\n    message = ParseDict(value, SIGNALS[signal](), ignore_unknown_fields=False)\n    return envelope(signal, message.SerializeToString(deterministic=True))\n\n\nclass OTLPJSONDecoder:\n    \"\"\"Official-protobuf adapter for the archive decoder port.\"\"\"\n\n    def decode(self, signal: str, record: bytes) -> ArchiveEnvelope:\n        from typing import cast\n        return decode_json(cast(Signal, signal), record)\n\n\ndef normalize_ids(signal: Signal, value: dict[str, Any]) -> None:\n    \"\"\"OTLP JSON uses hex IDs, unlike the protobuf JSON parser's base64 bytes.\"\"\"\n    resource_key, scope_key, record_key = (\n        ('resourceSpans', 'scopeSpans', 'spans') if signal == 'traces'\n        else ('resourceLogs', 'scopeLogs', 'logRecords')\n    )\n    if signal == 'metrics':\n        for resource in value.get('resourceMetrics', []):\n            for scope in resource.get('scopeMetrics', []):\n                for metric in scope.get('metrics', []):\n                    for kind in ('gauge', 'sum', 'histogram', 'exponentialHistogram', 'summary'):\n                        for point in metric.get(kind, {}).get('dataPoints', []):\n                            for exemplar in point.get('exemplars', []):\n                                normalize_id_fields(exemplar)\n        return\n    for resource in value.get(resource_key, []):\n        for scope in resource.get(scope_key, []):\n            for record in scope.get(record_key, []):\n                for item in [record, *record.get('links', [])]:\n                    normalize_id_fields(item)\n\n\ndef normalize_id_fields(item: dict[str, Any]) -> None:\n    \"\"\"Own the OTLP hex-byte conversion for records, links and metric exemplars.\"\"\"\n    for key, size in [('traceId', 16), ('spanId', 8), ('parentSpanId', 8)]:\n        if item.get(key):\n            raw = bytes.fromhex(item[key])\n            if len(raw) != size:\n                raise ValueError('invalid OTLP identifier length')\n            item[key] = base64.b64encode(raw).decode()\n", replace: "\"\"\"Decode the qualified Collector OTLP JSON file representation with official types.\"\"\"\nimport base64\nimport json\nfrom typing import Any\n\nfrom clauditor.archive.domain.envelope import ArchiveEnvelope, Signal, envelope\nfrom google.protobuf.json_format import ParseDict\nfrom google.protobuf.message import Message\nfrom opentelemetry.proto.collector.logs.v1.logs_service_pb2 import ExportLogsServiceRequest\nfrom opentelemetry.proto.collector.metrics.v1.metrics_service_pb2 import ExportMetricsServiceRequest\nfrom opentelemetry.proto.collector.trace.v1.trace_service_pb2 import ExportTraceServiceRequest\n\nMAX_RECORD_BYTES\
          \ = 4 * 1024 * 1024\nSIGNALS: dict[str, type[Message]] = {\n    'logs': ExportLogsServiceRequest,\n    'metrics': ExportMetricsServiceRequest,\n    'traces': ExportTraceServiceRequest,\n}\n\n\ndef decode_json(signal: Signal, record: bytes) -> ArchiveEnvelope:\n    \"\"\"Reject malformed/unknown fields; preserve OTLP numeric and AnyValue types.\"\"\"\n    if len(record) > MAX_RECORD_BYTES:\n        raise ValueError('archive record exceeds limit')\n    if signal not in SIGNALS:\n        raise ValueError('unsupported signal')\n    value: Any = json.loads(record)\n    if not isinstance(value, dict) or not value:\n        raise ValueError('expected nonempty OTLP object')\n    normalize_ids(signal, value)\n    message = ParseDict(value, SIGNALS[signal](), ignore_unknown_fields=False)\n    return envelope(signal, message.SerializeToString(deterministic=True))\n\n\nclass OTLPJSONDecoder:\n    \"\"\"Official-protobuf adapter for the archive decoder port.\"\"\"\n\n    def decode(self, signal: str, record: bytes) -> ArchiveEnvelope:\n        from typing import cast\n        return decode_json(cast(Signal, signal), record)\n\n\ndef normalize_ids(signal: Signal, value: dict[str, Any]) -> None:\n    \"\"\"OTLP JSON uses hex IDs, unlike the protobuf JSON parser's base64 bytes.\"\"\"\n    resource_key, scope_key, record_key = (\n        ('resourceSpans', 'scopeSpans', 'spans') if signal == 'traces'\n        else ('resourceLogs', 'scopeLogs', 'logRecords')\n    )\n    if signal == 'metrics':\n        for resource in value.get('resourceMetrics', []):\n            for scope in resource.get('scopeMetrics', []):\n                for metric in scope.get('metrics', []):\n                    for kind in ('gauge', 'sum', 'histogram', 'exponentialHistogram', 'summary'):\n                        for point in metric.get(kind, {}).get('dataPoints', []):\n                            for exemplar in point.get('exemplars', []):\n                                normalize_id_fields(exemplar)\n        return\n    for resource in value.get(resource_key, []):\n        for scope in resource.get(scope_key, []):\n            for record in scope.get(record_key, []):\n                for item in [record, *record.get('links', [])]:\n                    normalize_id_fields(item)\n\n\ndef normalize_id_fields(item: dict[str, Any]) -> None:\n    \"\"\"Own the OTLP hex-byte conversion for records, links and metric exemplars.\"\"\"\n    for key, size in [('traceId', 16), ('spanId', 8), ('parentSpanId', 8)]:\n        if item.get(key):\n            raw = bytes.fromhex(item[key])\n            if len(raw) != size:\n                raise ValueError('invalid OTLP identifier length')\n            item[key] = base64.b64encode(raw).decode()\n\n\"\"\"A decoded source envelope remains distinct from indexing or durable receipt.\"\"\"\nfrom dataclasses import dataclass\nfrom typing import Literal\n\nSignal = Literal['logs', 'traces', 'metrics']\n\n\n@dataclass(frozen=True)\nclass ArchiveEnvelope:\n    \"\"\"Source-faithful protobuf bytes; no claim of authenticated source completeness.\"\"\"\n\n    signal: Signal\n    protobuf: bytes\n\n\ndef envelope(signal: Signal, protobuf: bytes) -> ArchiveEnvelope:\n    \"\"\"Construct only decoded, nonempty signal payloads.\"\"\"\n    if signal not in ('logs', 'traces', 'metrics') or not protobuf:\n        raise ValueError('empty or unsupported OTLP envelope')\n    return ArchiveEnvelope(signal=signal, protobuf=protobuf)\n"}
