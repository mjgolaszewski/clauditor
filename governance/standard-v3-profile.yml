claim_model:
  version: '1.0'
  dependency_sets:
    subject: [backend/src/**, config/**, deploy/**, spec/**, plans/**]
    detectors: [scripts/**, tools/**]
    tests: [backend/tests/**, governance/test-manifests/**]
    toolchain: [requirements-*.txt, pyproject.toml]
    trust: [AGENTS.yml, governance/**, .github/**, MEMORY.yml, phases/**, audits/**, CHANGELOG.md]
  execution_groups:
    preflight:
      producer: preflight
      captured_by_preflight: true
      claims: [governance-contracts-valid, governance-exposure-clean, source-syntax-format, semantic-ownership-valid]
    architecture-context-membership:
      producer: architecture-context-membership
      claims: [architecture-context-membership]
    architecture-cqrs-side:
      producer: architecture-cqrs-side
      claims: [architecture-cqrs-side]
    architecture-duplication:
      producer: architecture-duplication
      claims: [architecture-duplication]
    architecture-import-boundaries:
      producer: architecture-import-boundaries
      claims: [architecture-import-boundaries]
    architecture-layer-membership:
      producer: architecture-layer-membership
      claims: [architecture-layer-membership]
    architecture-module-size:
      producer: architecture-module-size
      claims: [architecture-module-size]
    architecture-router-thinness:
